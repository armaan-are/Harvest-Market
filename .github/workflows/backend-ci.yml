name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-backend:
    runs-on: self-hosted
    env:
      PYTHONPATH: .
      PYLINTHOME: /tmp/pylint-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pylint
        run: python -m pylint backend/main.py backend/tests/test_api.py

      - name: Run pytest
        run: python -m pytest backend/tests/test_api.py
